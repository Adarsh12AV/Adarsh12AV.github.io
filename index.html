<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird - Updated</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: skyblue;
        }
        #game {
            width: 100vw;
            height: 85vh;
            position: relative;
        }
        #bird {
            width: 40px;
            height: 40px;
            background: yellow;
            position: absolute;
            top: 300px;
            left: 150px;
            border-radius: 50%;
        }
        .pipe {
            position: absolute;
            width: 60px;
            background: green;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game">
        <div id="scoreBoard">स्कोर: <span id="score">0</span><br>हाई स्कोर: <span id="highScore">0</span></div>
        <div id="bird"></div>
    </div>

    <!-- यह रहा तेरा पसंद का लाल वाला पीडीएफ बटन -->
    <div style="text-align: center; height: 15vh; background: #81d4fa; display: flex; align-items: center; justify-content: center;">
        <a href="Class11.pdf" target="_blank" style="background: #ff4757; color: white; padding: 10px 25px; font-size: 18px; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            📄 क्लास 11 की पीडीएफ खोलें (Open PDF)
        </a>
    </div>

    <script>
        let bird = document.getElementById('bird');
        let game = document.getElementById('game');
        let scoreDisplay = document.getElementById('score');
        let highScoreDisplay = document.getElementById('highScore');

        let birdY = 300;
        let birdX = 150;
        let gravity = 0.6;
        let lift = -10;
        let velocity = 0;
        let isGameOver = false;
        let score = 0;
        let highScore = localStorage.getItem("flappyHighScore") || 0;
        highScoreDisplay.innerHTML = highScore;

        let pipes = [];
        let pipeWidth = 60;
        let pipeGap = 160;
        let pipeSpeed = 3;
        let frameCount = 0;

        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                velocity = lift;
                if(isGameOver) {
                    resetGame();
                }
            }
        });

        document.addEventListener('click', function() {
            velocity = lift;
            if(isGameOver) {
                resetGame();
            }
        });

        function createPipe() {
            let minHeight = 50;
            let maxHeight = game.clientHeight - pipeGap - 100;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            let topPipe = document.createElement('div');
            topPipe.classList.add('pipe');
            topPipe.style.top = '0px';
            topPipe.style.height = topHeight + 'px';
            topPipe.style.left = game.clientWidth + 'px';
            game.appendChild(topPipe);

            let bottomPipe = document.createElement('div');
            bottomPipe.classList.add('pipe');
            bottomPipe.style.bottom = '0px';
            bottomPipe.style.height = (game.clientHeight - topHeight - pipeGap) + 'px';
            bottomPipe.style.left = game.clientWidth + 'px';
            game.appendChild(bottomPipe);

            pipes.push({ top: topPipe, bottom: bottomPipe, passed: false });
        }

        function updateGame() {
            if (isGameOver) return;

            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            if (birdY <= 0 || birdY >= game.clientHeight - 40) {
                gameOver();
                return;
            }

            if (frameCount % 100 === 0) {
                createPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                let currentLeft = parseInt(p.top.style.left);
                currentLeft -= pipeSpeed;
                p.top.style.left = currentLeft + 'px';
                p.bottom.style.left = currentLeft + 'px';

                if (currentLeft + pipeWidth < 0) {
                    p.top.remove();
                    p.bottom.remove();
                    pipes.splice(i, 1);
                }

                if (!p.passed && currentLeft < birdX) {
                    score++;
                    scoreDisplay.innerHTML = score;
                    p.passed = true;
                }

                let birdRect = bird.getBoundingClientRect();
                let topRect = p.top.getBoundingClientRect();
                let bottomRect = p.bottom.getBoundingClientRect();

                if (
                    birdRect.left < topRect.right &&
                    birdRect.right > topRect.left &&
                    birdRect.top < topRect.bottom
                ) {
                    gameOver();
                }

                if (
                    birdRect.left < bottomRect.right &&
                    birdRect.right > bottomRect.left &&
                    birdRect.bottom > bottomRect.top
                ) {
                    gameOver();
                }
            }

            frameCount++;
            requestAnimationFrame(updateGame);
        }

        function gameOver() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("flappyHighScore", highScore);
                highScoreDisplay.innerHTML = highScore;
            }
            alert("गेम ओवर! आपका स्कोर: " + score + "\nहाई स्कोर: " + highScore);
            location.reload();
        }

        function resetGame() {
            isGameOver = false;
            birdY = 300;
            velocity = 0;
            score = 0;
            scoreDisplay.innerHTML = 0;
            pipes.forEach(p => { p.top.remove(); p.bottom.remove(); });
            pipes = [];
            frameCount = 0;
            updateGame();
        }

        updateGame();
    </script>
</body>
</html>
